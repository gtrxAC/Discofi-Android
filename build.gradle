// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.0.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // TODO: make it build on jitpack so that you don't need to provide your github credentials to build microcord
        maven {
            url "https://maven.pkg.github.com/leap0x7b/glide-backport"
            credentials {
                username = project.hasProperty("gpr.user") ? project.property("gpr.user") : System.getenv("GPR_USERNAME")
                password = project.hasProperty("gpr.key") ? project.property("gpr.key") : System.getenv("GPR_TOKEN")
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
